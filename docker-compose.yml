version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - QUANTFORGE_CONFIG=/app/config.yaml
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

  # Optional: Add a reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api
    restart: unless-stopped
